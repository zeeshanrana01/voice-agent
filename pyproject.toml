[project]
name = "voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "zeeshanrana2014@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "livekit-agents>=1.8.2",
    "livekit-plugins-ai-coustics>=0.3.2",
